services:
  db:
    # Pinned: pgvector 0.8.6 on Postgres 16 (Debian bookworm).
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reformulation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reformulation"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env
    environment:
      # .env points at localhost for host-side runs; inside compose the DB host is `db`.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reformulation
    volumes:
      # Corpus for the ingest CLI (docker compose exec api python -m app.ingest data/corpus/).
      # Mounted, not baked in: editing a document doesn't need an image rebuild.
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
