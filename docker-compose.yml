services:
  db:
    # Pinned: pgvector 0.8.6 on Postgres 16 (Debian bookworm).
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reformulation
    ports:
      # Host access for local tools only: not published on the LAN with the default password.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [default, offline]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reformulation"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      args:
        # Baked into the image at build time; keep in sync with the runtime EMBEDDING_MODEL.
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    env_file: .env
    environment:
      # .env points at localhost for host-side runs; inside compose the DB host is `db`.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reformulation
    volumes:
      # Corpus for the ingest CLI (docker compose exec api python -m app.ingest data/corpus/).
      # Mounted, not baked in: editing a document doesn't need an image rebuild.
      - ./data:/app/data:ro
      # Retrieval eval (make eval): a measurement tool, not part of the service, so it is
      # mounted like the corpus instead of being baked into the runtime image.
      - ./eval:/app/eval:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ruff + pytest: `docker compose run --rm test` (append a command to override, e.g.
  # `docker compose run --rm test pytest -q tests/test_calc_nutrition.py`).
  # Behind a profile, so `docker compose up` never starts it. Runs offline and keyless: only the
  # `offline` network (internal: db reachable, internet not), LLM keys forced empty.
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    environment:
      # Env vars win over the mounted .env (which points at localhost and holds real keys).
      # A separate *_test database: the fixtures create it and truncate it before each test.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reformulation_test
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      TEST_NETWORK_ISOLATED: "1"
    networks: [offline]
    volumes:
      - .:/src
    depends_on:
      db:
        condition: service_healthy

  # Live /reformulate runs against the running api (make live-runs): the dev image (httpx), the
  # repo mounted so docs/live_runs* land in it, and the default network to reach `api`. Uses the
  # api's real LLM key through the api itself; never part of `make test`.
  live:
    profiles: ["tools"]
    build:
      context: .
      target: dev
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    environment:
      BASE_URL: http://api:8000
    volumes:
      - .:/src
    depends_on:
      api:
        condition: service_started
    command: ["python", "scripts/live_runs.py"]

networks:
  offline:
    internal: true

volumes:
  pgdata:
