name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # A *_test database: the fixtures create it and truncate it before each test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reformulation_test
      # Tests never call a live LLM: no keys in CI, as in `docker compose run --rm test`.
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      # Use the interpreter set up above, never a download (as UV_PYTHON_DOWNLOADS=0 in Docker).
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      # The exact interpreter from .python-version (3.12.14, as in the Docker image): uv 0.9.30
      # cannot download that patch release itself, and the runner's system Python is older.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30" # same as the Dockerfile
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen # Python version from .python-version
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q -rs

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: reformulation-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s:
    name: k8s manifests
    runs-on: ubuntu-latest
    # No cluster: render the kustomization and validate every object against the API schemas.
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1 # same client as used locally (Docker Desktop)
      - name: kustomize + kubeconform
        run: |
          kubeconform() {
            docker run --rm -i -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.8.0-alpine \
              -strict -summary -ignore-missing-schemas -kubernetes-version 1.34.0 "$@"
          }
          kubectl kustomize k8s/ | kubeconform -
          # Not in the kustomization, but shipped: the ingest Job and the Secret example.
          kubeconform /k8s/ingest-job.yaml /k8s/secret.example.yaml
