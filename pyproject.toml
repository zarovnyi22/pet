[project]
name = "reformulation-assistant"
version = "0.1.0"
description = "RAG + tool-calling agent for food product reformulation"
requires-python = "==3.12.*"
# Direct deps pinned exactly (== what uv.lock resolved); transitive deps are pinned by uv.lock.
dependencies = [
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "sentence-transformers==6.1.0",
    "torch==2.14.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

# CPU-only torch: the CUDA build is ~5 GB of wheels we never use (embeddings run on CPU).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The project is not installed (package = false), so tests import `app` from the repo root.
pythonpath = ["."]
