# Example only: NOT in kustomization.yaml and never filled in in git. `make k8s-up` creates
# the real Secrets:
#   pet-llm      from .env  (kubectl create secret generic pet-llm --from-env-file=.env)
#   pet-postgres a random password, generated once per cluster
# .env also carries DATABASE_URL=...localhost...; the Deployment overrides it with its own env.
apiVersion: v1
kind: Secret
metadata:
  name: pet-llm
  namespace: pet
type: Opaque
stringData:
  LLM_PROVIDER: gemini
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pet-postgres
  namespace: pet
type: Opaque
stringData:
  password: ""
