apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pet
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # The same image as docker-compose.yml: pgvector preinstalled.
          image: pgvector/pgvector:0.8.6-pg16-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: reformulation
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pet-postgres
                  key: password
            # A subdirectory: initdb refuses a non-empty volume root (lost+found on some disks).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "reformulation"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "reformulation"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # PVC per replica; kind's default storage class (local-path, "standard") provisions it.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
